<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Questionnaire</title>
</head>
<body>
  <h1>Personal Questionnaire</h1>
  <form id="form">
    <label>User ID: <input type="text" id="user_id" required></label><br><br>
    <div id="questions"></div>
    <button type="submit">Submit</button>
  </form>

  <script>
    async function loadQuestions() {
      const res = await fetch('/questions');
      const data = await res.json();
      const container = document.getElementById('questions');
      data.forEach(q => {
        container.innerHTML += `
          <label><strong>[${q.category}]</strong> ${q.question}<br>
            <input name="${q.id}" required><br><br>
          </label>`;
      });
    }

    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const user_id = document.getElementById('user_id').value;
      const formData = new FormData(e.target);
      const answers = {};
      formData.forEach((val, key) => {
        if (key !== 'user_id') answers[key] = val;
      });

      const res = await fetch('/submit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ user_id, answers })
      });

      const json = await res.json();
      alert(json.message);
    });

    loadQuestions();
  </script>
</body>
</html>
