<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Questionnaire</title>
  <link rel="stylesheet" href="../static/styles.css" />
</head>
<body>
  <h1>Personal Questionnaire</h1>
  <form id="form">
    <label>User ID: <input type="text" id="user_id" required></label><br><br>
    <div id="questions"></div>
    <button type="submit">Submit</button>
  </form>
  <script>
    async function loadQuestions() {
      try {
        const res = await fetch('static/questions.json'); // ✅ Load from static/
        const data = await res.json();
        const container = document.getElementById('questions');
        data.forEach(q => {
          container.innerHTML += `
            <label><strong>[${q.category}]</strong> ${q.question}<br>
              <input name="${q.id}" required><br><br>
            </label>`;
        });
      } catch (err) {
        console.error("Failed to load questions:", err);
      }
    }

    loadQuestions(); // Call the function on page load
  </script>
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore.js"></script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
  import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDBHkhvmr1dmV8JJYyQ0Pzf7CVc1ecji20",
    authDomain: "questionaie.firebaseapp.com",
    projectId: "questionaie",
    storageBucket: "questionaie.appspot.com",
    messagingSenderId: "732970239887",
    appId: "1:732970239887:web:d9bda41b01b646f7572dfa",
    measurementId: "G-GEPBZMWY9N"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const res = await fetch('static/questions.json');
  document.getElementById('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const user_id = document.getElementById('user_id').value;
    const formData = new FormData(e.target);
    const answers = {};
    formData.forEach((val, key) => {
      if (key !== 'user_id') answers[key] = val;
    });

    try {
      await addDoc(collection(db, "responses"), {
        user_id,
        answers,
        timestamp: new Date().toISOString()
      });
      alert("Response saved successfully!");
    } catch (err) {
      console.error("Error writing to Firestore:", err);
      alert("Error saving response: " + err.message);
    }
  });
</script>
</body>
</html>
