<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Questionnaire</title>
</head>
<body>
  <h1>Personal Questionnaire</h1>
  <form id="form">
    <label>User ID: <input type="text" id="user_id" required></label><br><br>
    <div id="questions"></div>
    <button type="submit">Submit</button>
  </form>
  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore.js"></script>

  <script type="module">
    // Import the functions you need from the SDKs you need
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore.js";

    // Your Firebase configuration
    const firebaseConfig = {
      apiKey: "AIzaSyDBHkhvmr1dmV8JJYyQ0Pzf7CVc1ecji20",
      authDomain: "questionaie.firebaseapp.com",
      projectId: "questionaie",
      storageBucket: "questionaie.appspot.com",
      messagingSenderId: "732970239887",
      appId: "1:732970239887:web:d9bda41b01b646f7572dfa",
      measurementId: "G-GEPBZMWY9N"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);  // Initialize Firestore

    // Function to load questions
    async function loadQuestions() {
      const res = await fetch('/questions'); // Adjust this to fetch your actual questions
      const data = await res.json();
      const container = document.getElementById('questions');
      data.forEach(q => {
        container.innerHTML += `
          <label><strong>[${q.category}]</strong> ${q.question}<br>
            <input name="${q.id}" required><br><br>
          </label>`;
      });
    }

    // Handle form submission
    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const user_id = document.getElementById('user_id').value;
      const formData = new FormData(e.target);
      const answers = {};
      formData.forEach((val, key) => {
        if (key !== 'user_id') answers[key] = val;
      });

      // Save to Firebase Firestore
      try {
        const docRef = await addDoc(collection(db, "responses"), {
          user_id: user_id,
          answers: answers,
          timestamp: new Date().toISOString()
        });
        alert('Responses saved successfully!');
      } catch (e) {
        console.error("Error adding document: ", e);
        alert('Error saving responses.');
      }
    });

    loadQuestions();
  </script>
</body>
</html>
